<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedAuto Showroom - CRUD</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="hero">
    <div class="overlay">
      <h1>SpeedAuto Showroom</h1>
    </div>
  </header>

  <main>
    <section id="car-list" class="grid"></section>

    <section class="form-section card-center">
      <h2>Tambah Mobil Baru</h2>
      <form id="addCarForm">
        <input type="text" id="nama" placeholder="Nama Mobil" required>
        <input type="number" id="harga" placeholder="Harga Mobil" required>
        <input type="text" id="gambar" placeholder="URL Gambar (opsional)">
        <button type="submit" class="btn primary">Tambah Mobil</button>
      </form>
    </section>
  </main>

  <!-- Edit Modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="modal-close">&times;</button>
      <h3>Edit Mobil</h3>
      <form id="editCarForm">
        <input type="hidden" id="editId">
        <input type="text" id="editNama" placeholder="Nama Mobil" required>
        <input type="number" id="editHarga" placeholder="Harga Mobil" required>
        <input type="text" id="editGambar" placeholder="URL Gambar (opsional)">
        <div class="modal-actions">
          <button type="submit" class="btn primary">Simpan</button>
          <button type="button" id="cancelEdit" class="btn secondary">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2025 SpeedAuto Showroom. All Rights Reserved.</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
